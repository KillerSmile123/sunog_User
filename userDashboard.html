<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.U.N.O.G</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: calc(100% - 130px);
            margin-top: 60px;
            background: #f0f0f0;
        }

        /* Header Bar */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #800000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Top Bar - Bottom Navigation */
        .top-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: #800000;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0;
            z-index: 600;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
        }


        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
        }
 
        .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        /* Logout Button */
        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .logout-icon {
            font-size: 20px;
            color: white;
        }

        .top-bar-controls {
            display: flex;
            gap: 0;
            align-items: center;
            width: 100%;
            justify-content: space-around;
        }

        /* Bottom Nav Item */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            text-decoration: none;
            color: white;
            font-size: 14px;
        }

        .nav-item:hover {
            opacity: 0.8;
        }

        .nav-item.active {
            opacity: 1;
        }

        .nav-icon {
            font-size: 26px;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            display: flex;
            color: white;
        }

        /* Report Button - Center */
        .report-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            text-decoration: none;
            color: white;
            font-size: 14px;
            background: linear-gradient(to right, #5d0202, #ff2222);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(255,99,71,0.4);
        }

        .report-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255,99,71,0.5);
        }

        .report-icon {
            font-size: 32px;
            margin-bottom: 2px;
        }

        .report-label {
            font-size: 10px;
            text-align: center;
            white-space: nowrap;
            color: white;
        }




        /* Notification Bell - Bottom Nav Style */
        .notification-bell {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            transition: all 0.2s;
            background-color: transparent;
        }

        .notification-bell:hover {
            opacity: 0.8;
        }

        .notification-bell:active {
            transform: scale(0.95);
        }

        .notification-bell .bell-icon {
            font-size: 26px;
            position: relative;
            margin-bottom: 4px;
        }

        .notification-bell .badge {
            position: absolute;
            top: 8px;
            right: 18px;
            background-color: #ff3b30;
            color: white;
            border-radius: 10px;
            min-width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid #800000;
        }

        .notification-bell .badge.active {
            display: flex;
        }

        .notification-bell .label {
            font-size: 11px;
            color: white;
        }

        /* Burger Menu - Hidden */
        .burger {
            display: none;
        }


        /* Dropdown - Hidden */
        .dropdown {
            display: none;
        }

        .dropdown.active {
            display: none;
        }


        /* Facebook-Style Notification Panel */
        .notification-panel {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 360px;
            max-height: 480px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 700;
            display: none;
            animation: slideDown 0.2s ease-out;
        }


        .notification-panel.active {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-panel::before {
            content: '';
            position: absolute;
            top: -8px;
            right: 20px;
            width: 16px;
            height: 16px;
            background-color: white;
            transform: rotate(45deg);
            box-shadow: -2px -2px 4px rgba(0,0,0,0.05);
        }

        .notification-panel-header {
            background-color: white;
            color: #050505;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e4e6eb;
        }

        .notification-panel-header h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #050505;
        }

        .notification-tabs {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e4e6eb;
        }

        .notification-tab {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #65676b;
            transition: all 0.2s;
        }

        .notification-tab:hover {
            background-color: #e4e6eb;
        }

        .notification-tab.active {
            background-color: #e7f3ff;
            color: #1877f2;
        }

        .mark-all-btn {
            background-color: transparent;
            color: #1877f2;
            border: none;
            padding: 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .mark-all-btn:hover {
            color: #145dbf;
            text-decoration: underline;
        }

        #notification-list {
            max-height: 400px;
            overflow-y: auto;
            background-color: white;
        }

        #notification-list::-webkit-scrollbar {
            width: 8px;
        }

        #notification-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #notification-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        #notification-list::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .notification-item {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .notification-item:hover {
            background-color: #f2f2f2;
        }

        .notification-item.unread {
            background-color: #e7f3ff;
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background-color: #1877f2;
            border-radius: 50%;
        }

        .notification-item.unread {
            padding-left: 32px;
        }

        .no-notifications {
            text-align: center;
            padding: 60px 20px;
            color: #65676b;
        }

        .notification-icon {
    font-size: 28px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.notification-icon.warning {
    background-color: #fff3cd;
}

.notification-icon.success {
    background-color: #d1f2dd;
}

.notification-icon.error {
    background-color: #f8d7da;
}

.notification-content {
    flex: 1;
    min-width: 0;
}

.notification-content p {
    margin: 0 0 4px 0;
    font-size: 14px;
    color: #050505;
}

.notification-content strong {
    font-weight: 600;
    color: #050505;
}

.notification-time {
    font-size: 12px;
    color: #65676b;
    margin-top: 4px;
}

.notification-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-left: 8px;
}

.action-btn-primary,
.action-btn-secondary {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
}

.action-btn-primary {
    background-color: #1877f2;
    color: white;
}

.action-btn-primary:hover {
    background-color: #145dbf;
}

.action-btn-secondary {
    background-color: #e4e6eb;
    color: #050505;
}

.action-btn-secondary:hover {
    background-color: #d8dadf;
}

        .no-notifications-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-notifications p {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #050505;
        }

        /* Floating Fire Report Button */
        .fire-report-btn {
            display: none;
        }


        @media (max-width: 600px) {
            .fire-report-btn {
                font-size: 16px;
                padding: 12px 20px;
            }

            .notification-panel {
                width: calc(100vw - 30px);
                right: 15px;
                left: 15px;
            }

            .notification-panel::before {
                right: 50px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header-bar">
        <div class="logo-section">
            <img src="images/FireTackrlogo.png" class="logo-img" alt="Fire Logo">
           
        </div>
        <!-- Logout Button in Top Right -->
        <a href="login.html" class="logout-btn">
            <span class="logout-icon">🚪</span>
        </a>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Bottom Navigation Bar -->
    <div class="top-bar">
        <!-- Notification Bell -->
        <div class="notification-bell" id="notificationBell">
            <span class="bell-icon">🔔</span>
            <span id="notification-badge" class="badge">0</span>
        </div>

        <!-- My Profile -->
        <a href="userProf.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label">My Profile</span>
        </a>

        <!-- Report Button - Center -->
        <a href="alert.html" class="report-btn">
            <span class="report-icon">🔥</span>
            <span class="report-label">Report</span>
        </a>

        <!-- Settings -->
        <a href="Setting.html" class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
        </a>

        <!-- View Report -->
        <a href="viewreport.html" class="nav-item">
            <span class="nav-icon">👀</span>
            <span class="nav-label">View Reports</span>
        </a>
    </div>


    <!-- Facebook-Style Notification Panel -->
        <div id="notification-panel" class="notification-panel">
            <div class="notification-panel-header">
                <h3>Notifications</h3>
                <button class="mark-all-btn" onclick="handleMarkAllAsRead()">Mark all as read</button>
            </div>
            <div class="notification-tabs">
                <button class="notification-tab active">All</button>
                <button class="notification-tab">Unread</button>
            </div>
            <div id="notification-list">
                <!-- Notifications will be rendered here -->
            </div>
        </div>

    <!-- Floating Fire Report Button -->
    <a href="alert.html" class="fire-report-btn">Report 🔥</a>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Notification User Script -->
    <script src="../js/notificationUser.js"></script>

    <!-- Dashboard Script -->
    <script src="../js/dashboard.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const notificationBell = document.getElementById('notificationBell');
            const notificationPanel = document.getElementById('notification-panel');
            
            console.log('🔔 Setting up notification panel toggle');
            console.log('Bell element:', notificationBell);
            console.log('Panel element:', notificationPanel);
            
            // Notification bell toggle
            if (notificationBell && notificationPanel) {
                notificationBell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    console.log('🔔 Bell clicked');
                    
                    // Toggle display
                    if (notificationPanel.style.display === 'none' || !notificationPanel.style.display) {
                        notificationPanel.style.display = 'block';
                        console.log('📂 Panel opened');
                    } else {
                        notificationPanel.style.display = 'none';
                        console.log('📁 Panel closed');
                    }
                });
                
                // Close notification panel when clicking outside
                document.addEventListener('click', (e) => {
                    if (!notificationBell.contains(e.target) && !notificationPanel.contains(e.target)) {
                        notificationPanel.style.display = 'none';
                    }
                });
            } else {
                console.error('❌ Notification elements not found!');
            }
        });
    </script>

</body>
</html>
