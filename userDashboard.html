<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.U.N.O.G</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: calc(100% - 60px);
            margin-top: 60px;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #800000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            z-index: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
        }

        .logo-icon {
            width: 100px;
            height: 90px;
        }

        /* Notification Bell - Facebook Style */
        .notification-bell {
            position: absolute;
            right: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.2s;
            background-color: rgba(255,255,255,0.1);
        }

        .notification-bell:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .notification-bell:active {
            transform: scale(0.95);
        }

        .notification-bell .bell-icon {
            font-size: 22px;
            position: relative;
        }

        .notification-bell .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff3b30;
            color: white;
            border-radius: 10px;
            min-width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid #800000;
        }

        .notification-bell .badge.active {
            display: flex;
        }

        /* Burger Menu */
        .burger {
            position: absolute;
            width: 25px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            right: 15px;
        }

        .burger div {
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        /* Dropdown */
        .dropdown {
            position: absolute;
            top: 60px;
            right: 15px;
            background-color: #800000;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            width: 150px;
            overflow: hidden;
            z-index: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .dropdown a {
            padding: 12px;
            font-size: 14px;
            color: white;
            text-decoration: none;
        }

        .dropdown a:hover {
            background-color: #a30000;
        }

        /* Facebook-Style Notification Panel */
        .notification-panel {
            position: absolute;
            top: 65px;
            right: 55px;
            width: 360px;
            max-height: 480px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 700;
            display: none;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Arrow pointing to bell */
        .notification-panel::before {
            content: '';
            position: absolute;
            top: -8px;
            right: 20px;
            width: 16px;
            height: 16px;
            background-color: white;
            transform: rotate(45deg);
            box-shadow: -2px -2px 4px rgba(0,0,0,0.05);
        }

        .notification-panel-header {
            background-color: white;
            color: #050505;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e4e6eb;
        }

        .notification-panel-header h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #050505;
        }

        .notification-tabs {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e4e6eb;
        }

        .notification-tab {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #65676b;
            transition: all 0.2s;
        }

        .notification-tab:hover {
            background-color: #e4e6eb;
        }

        .notification-tab.active {
            background-color: #e7f3ff;
            color: #1877f2;
        }

        .mark-all-btn {
            background-color: transparent;
            color: #1877f2;
            border: none;
            padding: 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .mark-all-btn:hover {
            color: #145dbf;
            text-decoration: underline;
        }

        #notification-list {
            max-height: 400px;
            overflow-y: auto;
            background-color: white;
        }

        /* Custom Scrollbar */
        #notification-list::-webkit-scrollbar {
            width: 8px;
        }

        #notification-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #notification-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        #notification-list::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .notification-item {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .notification-item:hover {
            background-color: #f2f2f2;
        }

        .notification-item.unread {
            background-color: #e7f3ff;
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background-color: #1877f2;
            border-radius: 50%;
        }

        .notification-item.unread {
            padding-left: 32px;
        }

        .notification-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .notification-icon.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .notification-icon.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .notification-icon.error {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-content p {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #050505;
            line-height: 1.4;
            font-weight: 400;
        }

        .notification-content strong {
            font-weight: 600;
        }

        .notification-time {
            font-size: 13px;
            color: #65676b;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notification-actions {
            display: none;
            gap: 8px;
            margin-top: 8px;
        }

        .notification-item:hover .notification-actions {
            display: flex;
        }

        .notification-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .action-btn-primary {
            background-color: #1877f2;
            color: white;
        }

        .action-btn-primary:hover {
            background-color: #145dbf;
        }

        .action-btn-secondary {
            background-color: #e4e6eb;
            color: #050505;
        }

        .action-btn-secondary:hover {
            background-color: #d8dadf;
        }

        .no-notifications {
            text-align: center;
            padding: 60px 20px;
            color: #65676b;
        }

        .no-notifications-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-notifications p {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #050505;
        }

        .no-notifications span {
            font-size: 15px;
            color: #65676b;
            display: block;
            margin-top: 8px;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #f02849;
        }

        /* Floating Fire Report Button - FIXED */
        .fire-report-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            background: linear-gradient(to right, #800000, #a30000);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            z-index: 600;
            text-decoration: none;
            box-shadow: 0 5px 12px rgba(255,0,0,0.4);
            transition: all 0.3s;
            display: inline-block;
        }

        .fire-report-btn:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 16px rgba(255,0,0,0.5);
        }

        /* Toast Notifications */
        .notification-container {
            position: absolute;
            top: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 600;
        }

        .notification {
            position: relative;
            background: rgba(255,255,255,0.95);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            width: 250px;
            font-size: 14px;
            animation: slideIn 0.5s ease-out;
        }

        .notification h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }

        @keyframes slideIn {
            from {opacity: 0; transform: translateX(100px);}
            to {opacity: 1; transform: translateX(0);}
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .fire-report-btn {
                font-size: 16px;
                padding: 12px 20px;
            }

            .notification-panel {
                width: calc(100vw - 30px);
                right: 15px;
                left: 15px;
            }

            .notification-panel::before {
                right: 50px;
            }
            
            .notification-bell {
                right: 50px;
                font-size: 20px;
            }

            .notification-icon {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        
        <div class="logo-section">
            <img src="images/FireTackrlogo.png" class="logo-icon" alt="Fire Logo">
            <div class="logo-text">FireTrackr</div>
        </div>

        <!-- Notification Bell Icon -->
        <div class="notification-bell" onclick="toggleNotificationPanel()">
            <span class="bell-icon">🔔</span>
            <span id="notification-badge" class="badge">0</span>
        </div>

        <!-- Burger -->
        <div class="burger" id="burger">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <!-- Dropdown -->
        <div class="dropdown" id="dropdown">
            <a href="userProf.html">👤 My Profile</a>
            <a href="Setting.html">⚙️ Settings</a>
            <a href="login.html">🚪 Logout</a>
            <a href="viewreport.html">👀 View Report</a>
        </div>

    </div>

    <!-- Facebook-Style Notification Panel -->
    <div id="notification-panel" class="notification-panel">
        <div class="notification-panel-header">
            <h3>Notifications</h3>
            <button onclick="markAllAsRead()" class="mark-all-btn">
                Mark all as read
            </button>
        </div>
        
        <div class="notification-tabs">
            <button class="notification-tab active">All</button>
            <button class="notification-tab">Unread</button>
        </div>

        <div id="notification-list">
            <!-- Notifications will be loaded here by notificationuser.js -->
        </div>
    </div>

    <!-- Floating Fire Report Button -->
    <a href="alert.html" class="fire-report-btn">Report 🔥</a>

    <!-- Toast Notification Container -->
    <div class="notification-container" id="notification-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Notification User Script -->
    <script src="../js/notificationuser.js"></script>

    <!-- Dashboard Script -->
    <script src="../js/dashboard.js"></script>

    <script>
        // Toggle Notification Panel
        function toggleNotificationPanel() {
            const panel = document.getElementById('notification-panel');
            const dropdown = document.getElementById('dropdown');
            
            // Close burger menu if open
            if (dropdown.style.display === 'flex') {
                dropdown.style.display = 'none';
            }
            
            // Toggle notification panel
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        // Mark all as read
        function markAllAsRead() {
            const unreadItems = document.querySelectorAll('.notification-item.unread');
            unreadItems.forEach(item => {
                item.classList.remove('unread');
            });
            
            const badge = document.getElementById('notification-badge');
            badge.classList.remove('active');
            badge.textContent = '0';
        }

        // Close notification panel when clicking outside
        document.addEventListener('click', function(event) {
            const panel = document.getElementById('notification-panel');
            const bell = document.querySelector('.notification-bell');
            const burger = document.getElementById('burger');
            const dropdown = document.getElementById('dropdown');
            
            // Close notification panel
            if (panel && bell && !panel.contains(event.target) && !bell.contains(event.target)) {
                panel.style.display = 'none';
            }
            
            // Toggle burger menu
            if (burger.contains(event.target)) {
                if (dropdown.style.display === 'flex') {
                    dropdown.style.display = 'none';
                } else {
                    dropdown.style.display = 'flex';
                    panel.style.display = 'none';
                }
            } else if (!dropdown.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });

        // Notification tabs functionality
        document.querySelectorAll('.notification-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.notification-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                if (this.textContent === 'Unread') {
                    document.querySelectorAll('.notification-item').forEach(item => {
                        if (!item.classList.contains('unread')) {
                            item.style.display = 'none';
                        } else {
                            item.style.display = 'flex';
                        }
                    });
                } else {
                    document.querySelectorAll('.notification-item').forEach(item => {
                        item.style.display = 'flex';
                    });
                }
            });
        });
    </script>

</body>
</html>
