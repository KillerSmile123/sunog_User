<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.U.N.O.G</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: calc(100% - 60px);
            margin-top: 60px;
            background: #f0f0f0;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #800000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .top-bar-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Notification Bell - Facebook Style */
        .notification-bell {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.2s;
            background-color: rgba(255,255,255,0.1);
        }

        .notification-bell:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .notification-bell:active {
            transform: scale(0.95);
        }

        .notification-bell .bell-icon {
            font-size: 22px;
            position: relative;
        }

        .notification-bell .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff3b30;
            color: white;
            border-radius: 10px;
            min-width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid #800000;
        }

        .notification-bell .badge.active {
            display: flex;
        }

        /* Burger Menu */
        .burger {
            width: 25px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            z-index: 701;
        }

        .burger div {
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: all 0.3s;
        }

        /* Dropdown */
        .dropdown {
            position: absolute;
            top: 60px;
            right: 15px;
            background-color: #800000;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            width: 150px;
            overflow: hidden;
            z-index: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .dropdown.active {
            display: flex;
        }

        .dropdown a {
            padding: 12px;
            font-size: 14px;
            color: white;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .dropdown a:hover {
            background-color: #a30000;
        }

        /* Facebook-Style Notification Panel */
        .notification-panel {
            position: absolute;
            top: 65px;
            right: 55px;
            width: 360px;
            max-height: 480px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 700;
            display: none;
            animation: slideDown 0.2s ease-out;
        }

        .notification-panel.active {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-panel::before {
            content: '';
            position: absolute;
            top: -8px;
            right: 20px;
            width: 16px;
            height: 16px;
            background-color: white;
            transform: rotate(45deg);
            box-shadow: -2px -2px 4px rgba(0,0,0,0.05);
        }

        .notification-panel-header {
            background-color: white;
            color: #050505;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e4e6eb;
        }

        .notification-panel-header h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #050505;
        }

        .notification-tabs {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e4e6eb;
        }

        .notification-tab {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #65676b;
            transition: all 0.2s;
        }

        .notification-tab:hover {
            background-color: #e4e6eb;
        }

        .notification-tab.active {
            background-color: #e7f3ff;
            color: #1877f2;
        }

        .mark-all-btn {
            background-color: transparent;
            color: #1877f2;
            border: none;
            padding: 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .mark-all-btn:hover {
            color: #145dbf;
            text-decoration: underline;
        }

        #notification-list {
            max-height: 400px;
            overflow-y: auto;
            background-color: white;
        }

        #notification-list::-webkit-scrollbar {
            width: 8px;
        }

        #notification-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #notification-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        #notification-list::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .notification-item {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .notification-item:hover {
            background-color: #f2f2f2;
        }

        .notification-item.unread {
            background-color: #e7f3ff;
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background-color: #1877f2;
            border-radius: 50%;
        }

        .notification-item.unread {
            padding-left: 32px;
        }

        .no-notifications {
            text-align: center;
            padding: 60px 20px;
            color: #65676b;
        }

        .no-notifications-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-notifications p {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #050505;
        }

        /* Floating Fire Report Button */
        .fire-report-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            background: linear-gradient(to right, #800000, #a30000);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            z-index: 600;
            text-decoration: none;
            box-shadow: 0 5px 12px rgba(255,0,0,0.4);
            transition: all 0.3s;
            display: inline-block;
        }

        .fire-report-btn:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 16px rgba(255,0,0,0.5);
        }

        @media (max-width: 600px) {
            .fire-report-btn {
                font-size: 16px;
                padding: 12px 20px;
            }

            .notification-panel {
                width: calc(100vw - 30px);
                right: 15px;
                left: 15px;
            }

            .notification-panel::before {
                right: 50px;
            }
        }
    </style>
</head>

<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo-section">
            <img src="images/FireTackrlogo.png" class="logo-icon" alt="Fire Logo">
            <div class="logo-text">FireTrackr</div>
        </div>

        <div class="top-bar-controls">
            <!-- Notification Bell Icon -->
            <div class="notification-bell" id="notificationBell">
                <span class="bell-icon">🔔</span>
                <span id="notification-badge" class="badge">0</span>
            </div>

            <!-- Burger -->
            <div class="burger" id="burger">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <!-- Dropdown -->
        <div class="dropdown" id="dropdown">
            <a href="userProf.html">👤 My Profile</a>
            <a href="Setting.html">⚙️ Settings</a>
            <a href="login.html">🚪 Logout</a>
            <a href="viewreport.html">👀 View Report</a>
        </div>

    </div>

    <!-- Facebook-Style Notification Panel -->
    <div id="notification-panel" class="notification-panel">
        <div class="notification-panel-header">
            <h3>Notifications</h3>
            <button onclick="markAllAsRead()" class="mark-all-btn">Mark all as read</button>
        </div>
        
        <div class="notification-tabs">
            <button class="notification-tab active">All</button>
            <button class="notification-tab">Unread</button>
        </div>

        <div id="notification-list">
            <div class="no-notifications">
                <div class="no-notifications-icon">🔔</div>
                <p>No notifications</p>
                <span>Check back later for updates</span>
            </div>
        </div>
    </div>

    <!-- Floating Fire Report Button -->
    <a href="alert.html" class="fire-report-btn">Report 🔥</a>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Notification User Script -->
    <script src="../js/notificationUser.js"></script>

    <!-- Dashboard Script -->
    <script src="../js/dashboard.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const burger = document.getElementById('burger');
            const dropdown = document.getElementById('dropdown');
            const notificationBell = document.getElementById('notificationBell');
            const notificationPanel = document.getElementById('notification-panel');
            
            // Burger menu toggle
            burger.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('active');
                notificationPanel.classList.remove('active');
            });
            
            // Notification bell toggle
            notificationBell.addEventListener('click', (e) => {
                e.stopPropagation();
                notificationPanel.classList.toggle('active');
                dropdown.classList.remove('active');
            });
            
            // Close menus when clicking outside
            document.addEventListener('click', (e) => {
                if (!burger.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('active');
                }
                if (!notificationBell.contains(e.target) && !notificationPanel.contains(e.target)) {
                    notificationPanel.classList.remove('active');
                }
            });
            
            // Close dropdown when clicking a link
            dropdown.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    dropdown.classList.remove('active');
                });
            });
        });

        function markAllAsRead() {
            document.querySelectorAll('.notification-item.unread').forEach(item => {
                item.classList.remove('unread');
            });
        }
    </script>

</body>
</html>
