<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F.I.R.E</title>
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main Styles -->
  <link rel="stylesheet" href="css/alert.css">
  
  <!-- Camera Modal Styles -->
  <link rel="stylesheet" href="css/camera-modal.css">
</head>

<body>
  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="userDashboard.html" class="back-arrow">⬅ Back</a>
    <span>FIRE REPORT</span>
  </div>

  <!-- Alert Form -->
  <div class="alert-container">
    <h2 id="welcomeMessage">Welcome!</h2>

    <form id="alertForm" enctype="multipart/form-data">
      
      <!-- Hidden fields (auto-filled by JavaScript) -->
      <input type="hidden" id="reporter_name" name="reporter_name" value="" />
      <input type="hidden" id="barangay" name="barangay" value="" />
      <input type="hidden" id="latitude" name="latitude" />
      <input type="hidden" id="longitude" name="longitude" />

      <!-- Description -->
      <div class="form-group">
        <label for="description">
          <i class="fas fa-file-alt"></i> Description
        </label>
        <textarea 
          id="description"
          name="description" 
          placeholder="Describe the fire incident... (optional)"
        ></textarea>
      </div>

      <!-- Hidden file inputs (replaced by custom JavaScript upload button) -->
      <input type="file" name="photo" id="photo" accept="image/*" style="display: none;" />
      <input type="file" name="video" id="video" accept="video/*" style="display: none;" />

      <!-- Media upload container (JavaScript will add button here) -->
      <div id="mediaUploadContainer"></div>

      <!-- Submit Button -->
      <button type="submit">
        <i class="fas fa-fire"></i> Send Fire Alert
      </button>
    </form>
  </div>

  <!-- Load JavaScript -->
  <script src="js/alert.js"></script>

</body>
</html>
