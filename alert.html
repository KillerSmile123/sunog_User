<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F.I.R.E</title>
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main Styles -->
  <link rel="stylesheet" href="css/alert.css">
  
  <!-- Camera Modal Styles -->
  <link rel="stylesheet" href="css/camera-modal.css">
</head>

<body>
  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="userDashboard.html" class="back-arrow">⬅ Back</a>
    <span>FIRE REPORT</span>
  </div>

  <!-- Alert Form -->
  <div class="alert-container">
    <h2 id="welcomeMessage">Welcome!</h2>

    <form id="alertForm">
  
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea name="description" id="description" rows="4" 
                  placeholder="Describe the fire incident..."></textarea>
      </div>

      <!-- ✅ Barangay (auto-filled from GPS) -->
      <div class="form-group">
        <label for="barangay">
          <i class="fas fa-map-marker-alt"></i> Location:
        </label>
        <input type="text" name="barangay" id="barangay" 
              placeholder="Getting location..." readonly>
        <small style="color: #666; font-size: 12px;">
          Location detected from your GPS coordinates
        </small>
      </div>

      <!-- Hidden GPS fields -->
      <input type="hidden" id="latitude" name="latitude">
      <input type="hidden" id="longitude" name="longitude">

      <!-- Media upload will be added by JavaScript -->

      <button type="submit">
        <i class="fas fa-fire"></i> Send Fire Alert
      </button>
    </form>
  </div>

  <!-- Load JavaScript -->
  <script src="js/alert.js"></script>

</body>
</html>
