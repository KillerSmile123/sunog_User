<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F.I.R.E</title>
  <link rel="stylesheet" href="css/alert.css?v=4.2" />
  <style>
    /* Additional styles for new fields */
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    
    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    
    .form-group input[type="text"]:focus,
    .form-group select:focus {
      outline: none;
      border-color: #ff6b35;
    }
    
    .required {
      color: #ff6b35;
    }
  </style>
</head>

<body>
  <!-- Top Navigation (No Dropdown) -->
  <div class="top-nav">
    <a href="userDashboard.html" class="back-arrow">⬅ Back</a>
    <span>FIRE REPORT</span>
  </div>

  <!-- Alert Form -->
  <div class="alert-container">
    <h2 id="welcomeMessage">Welcome, !</h2>

    <form id="alertForm" enctype="multipart/form-data">
      
      <!-- ✅ Auto-filled Reporter Name (from registration) -->
      <input type="hidden" id="reporter_name" name="reporter_name" value="" />
      
      <!-- ✅ Hidden barangay field -->
      <input type="hidden" id="barangay" name="barangay" value="" />

      <!-- Description -->
      <textarea 
        name="description" 
        placeholder="Describe the fire incident... (optional)"
      ></textarea>

      <!-- Photo Upload -->
      <label class="file-label" for="photo">📷 Upload Photo</label>
      <input type="file" name="photo" id="photo" accept="image/*" />

      <!-- Video Upload -->
      <label class="file-label" for="video">🎥 Upload Video</label>
      <input type="file" name="video" id="video" accept="video/*" />

      <!-- Hidden GPS Coordinates -->
      <input type="hidden" id="latitude" name="latitude" />
      <input type="hidden" id="longitude" name="longitude" />

      <div class="preview" id="preview"></div>

      <button type="submit">🔥 Send Fire Alert</button>
    </form>
  </div>

  <script src="../js/alert.js"></script>

</body>
</html>
