<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Report - S.U.N.O.G</title>
  <link rel="stylesheet" href="css/alert.css?v=1.0" />
  <link rel="stylesheet" href="css/viewreport.css?v=1.0" />
</head>

<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="userDashboard.html" class="back-arrow">⬅ Back</a>
    <span>MY REPORTS</span>
  </div>

  <!-- Main Container -->
  <div class="alert-container">
    <h2>Your Fire Reports</h2>

    <!-- Filter Section -->
    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">All Reports</button>
      <button class="filter-btn" data-filter="pending">⏳ Pending</button>
      <button class="filter-btn" data-filter="received">✓ Received</button>
    </div>

    <!-- Reports List -->
    <div class="reports-list" id="reportsList">
      <!-- Reports will be populated here by JavaScript -->
    </div>

    <!-- No Reports Message -->
    <div class="no-reports" id="noReports" style="display: none;">
      <div class="no-reports-icon">📋</div>
      <p>No reports found</p>
    </div>
  </div>

  <!-- Report Details Modal -->
  <div class="report-details-modal" id="reportModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Report Details</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody">
        <!-- Details will be populated here -->
      </div>
    </div>
  </div>

  <script src="js/viewreport.js"></script>

</body>
</html>
