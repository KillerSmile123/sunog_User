<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - FireTrackr</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
       background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 50%, #f0f0f0 100%);
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }
    .login-container {
      background: #2c3e50;
      border: 4px solid #34495e;
      border-radius: 20px;
      padding: 30px;
      width: 320px;
      text-align: center;
    }
    .logo-container {
      width: 180px;
      height: 80px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(1.2);
    }
    h2 {
      color: white;
      margin-bottom: 10px;
      font-size: 24px;
    }
    input {
      width: 90%; padding: 12px; margin: 10px 0; 
      border-radius: 8px; border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 12px 20px; background-color: #34495e; color: white;
      border: none; border-radius: 10px; cursor: pointer; width: 95%;
      margin-top: 10px; font-size: 16px;
      transition: background-color 0.3s ease;
    }
    button:hover { background-color: #4a6278; }
    button:disabled {
      background-color: #7f8c8d;
      cursor: not-allowed;
    }
    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 14px;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .register-link {
      margin-top: 15px;
      font-size: 14px;
      color: white;
    }
    .register-link a {
      color: #ff6b6b;
      text-decoration: none;
      font-weight: bold;
    }
    .register-link a:hover {
      text-decoration: underline;
      color: #ff8787;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <img src="images/FireTackrlogo.png" alt="FireTrackr Logo">
    </div>
    
    <h2>User Login</h2>
    <p style="color: #fff; font-size: 14px; margin-bottom: 20px;">
      Quick Login for Emergency Reports
    </p>
    
    <div id="messageBox"></div>
    
    <form id="loginForm">
      <input type="email" id="gmail" placeholder="Enter your Gmail" required autofocus>
      <button type="submit" id="loginBtn">Login</button>
    </form>

    <div class="register-link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
      const API_URL = 'https://backend-3-hqil.onrender.com';

      // Save token
      function saveToken(token) {
        sessionStorage.setItem("user_token", token);
      }

      // Show message
      function showMessage(message, type = 'error') {
        const messageBox = document.getElementById('messageBox');
        messageBox.innerHTML = `<div class="message ${type}">${message}</div>`;
        setTimeout(() => {
          messageBox.innerHTML = '';
        }, 5000);
      }

      // Login
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const gmail = document.getElementById('gmail').value.trim();
        const loginBtn = document.getElementById('loginBtn');
        
        if (!gmail) {
          showMessage('Please enter your Gmail address', 'error');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        try {
          const response = await fetch(`${API_URL}/user/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ gmail })
          });

          const data = await response.json();

          if (response.ok && data.token) {
            saveToken(data.token);
            
            // Save to sessionStorage
            sessionStorage.setItem("user_info", JSON.stringify(data.user));
            
            // ✅ ALSO save to localStorage for alert.js and userProf.js compatibility
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("fullName", data.user.fullname);
            localStorage.setItem("address", data.user.address);
            localStorage.setItem("gmail", data.user.gmail);
            localStorage.setItem("mobile", data.user.mobile);
            
            console.log("✅ User logged in:", data.user.fullname, "(ID:", data.user.id, ")");
            
            showMessage('Login successful! Redirecting...', 'success');
            setTimeout(() => {
              window.location.href = 'userDashboard.html';
            }, 1000);
          } else {
            showMessage(data.message || 'Login failed. Please check your email.', 'error');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
          }
        } catch (err) {
          console.error(err);
          showMessage('Connection error. Please try again.', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      });
  </script>
</body>
</html>
