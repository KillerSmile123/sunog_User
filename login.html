<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - S.U.N.O.G</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }
    .login-container {
      background: white;
      border: 4px solid #800000;
      border-radius: 20px;
      padding: 30px;
      width: 320px;
      text-align: center;
    }
    input {
      width: 90%; padding: 10px; margin: 10px 0; 
      border-radius: 8px; border: 1px solid #ccc;
    }
    button {
      padding: 12px 20px; background-color: #800000; color: white;
      border: none; border-radius: 10px; cursor: pointer; width: 95%;
      margin-top: 10px;
    }
    button:hover { background-color: #a30000; }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .otp-section {
      display: none;
    }
    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 14px;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .info { background-color: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>User Login</h2>
    
    <div id="messageBox"></div>
    
    <!-- Step 1: Email Input -->
    <div id="emailSection">
      <form id="emailForm">
        <input type="email" id="gmail" placeholder="Gmail Address" required>
        <button type="submit" id="sendOtpBtn">Send OTP</button>
      </form>
    </div>

    <!-- Step 2: OTP Input -->
    <div id="otpSection" class="otp-section">
      <p class="info">OTP has been sent to your email</p>
      <form id="otpForm">
        <input type="text" id="otp" placeholder="Enter 6-digit OTP" 
               maxlength="6" pattern="[0-9]{6}" required>
        <button type="submit" id="verifyOtpBtn">Verify & Login</button>
        <button type="button" id="resendOtpBtn">Resend OTP</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://backend-3-hqil.onrender.com';
    let userEmail = '';

    // Save token
    function saveToken(token) {
      sessionStorage.setItem("user_token", token);
    }

    // Show message
    function showMessage(message, type = 'info') {
      const messageBox = document.getElementById('messageBox');
      messageBox.innerHTML = `<div class="message ${type}">${message}</div>`;
      setTimeout(() => {
        messageBox.innerHTML = '';
      }, 5000);
    }

    // Step 1: Send OTP
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const gmail = document.getElementById('gmail').value;
      userEmail = gmail;
      const sendOtpBtn = document.getElementById('sendOtpBtn');
      
      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = 'Sending...';

      try {
        const response = await fetch(`${API_URL}/user/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ gmail })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('OTP sent successfully! Check your email.', 'success');
          document.getElementById('emailSection').style.display = 'none';
          document.getElementById('otpSection').style.display = 'block';
        } else {
          showMessage(data.message || 'Failed to send OTP', 'error');
          sendOtpBtn.disabled = false;
          sendOtpBtn.textContent = 'Send OTP';
        }
      } catch (err) {
        console.error(err);
        showMessage('Something went wrong. Please try again.', 'error');
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'Send OTP';
      }
    });

    // Step 2: Verify OTP
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const otp = document.getElementById('otp').value;
      const verifyOtpBtn = document.getElementById('verifyOtpBtn');
      
      if (otp.length !== 6) {
        showMessage('Please enter a valid 6-digit OTP', 'error');
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = 'Verifying...';

      try {
        const response = await fetch(`${API_URL}/user/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ gmail: userEmail, otp })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          saveToken(data.token);
          sessionStorage.setItem("user_info", JSON.stringify(data.user));
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'userDashboard.html';
          }, 1000);
        } else {
          showMessage(data.message || 'Invalid OTP', 'error');
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.textContent = 'Verify & Login';
        }
      } catch (err) {
        console.error(err);
        showMessage('Something went wrong. Please try again.', 'error');
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = 'Verify & Login';
      }
    });

    // Resend OTP
    document.getElementById('resendOtpBtn').addEventListener('click', async () => {
      const resendBtn = document.getElementById('resendOtpBtn');
      resendBtn.disabled = true;
      resendBtn.textContent = 'Sending...';

      try {
        const response = await fetch(`${API_URL}/user/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ gmail: userEmail })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('OTP resent successfully!', 'success');
        } else {
          showMessage(data.message || 'Failed to resend OTP', 'error');
        }
      } catch (err) {
        console.error(err);
        showMessage('Something went wrong. Please try again.', 'error');
      } finally {
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend OTP';
      }
    });
  </script>
</body>
</html>
